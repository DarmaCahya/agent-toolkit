[workspace]
resolver = "2"
members = [
    "crates/pdf-agent",
    "crates/agent-canvas",
]

default-members = ["crates/pdf-agent", "crates/agent-canvas"]

[workspace.package]
authors = ["Darma Cahya <darmady6@gmail.com>"]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/DarmaCahya/agent-toolkit"
homepage = "https://github.com/DarmaCahya/agent-toolkit"

[profile.dev]
debug = 0
strip = true

[profile.test]
debug = 0
strip = true
