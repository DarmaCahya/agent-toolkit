[package]
name = "pdf-agent"
version = "0.1.0"
edition = "2021"
authors = ["Darma Cahya <darmady6@gmail.com>"]
description = "A pure-Rust, memory-guarded PDF facade for AI agents: structured Markdown extraction, visual rasterization, and HTML-to-PDF generation."
license = "MIT OR Apache-2.0"
repository = "https://github.com/DarmaCahya/pdf-agent"
homepage = "https://github.com/DarmaCahya/pdf-agent"
readme = "README.md"
keywords = ["pdf", "ai-agent", "markdown", "rasterizer", "html-to-pdf"]
categories = ["text-processing", "graphics", "parser-implementations"]

[features]
default = ["reader", "render", "writer"]
reader = ["dep:pdf_oxide"]
render = ["dep:hayro", "dep:bytemuck", "dep:image"]
writer = ["dep:fulgur"]

[dependencies]
bytemuck = { version = "1.25.2", optional = true }
hayro = { version = "0.8.0", optional = true }
image = { version = "=0.25.6", default-features = false, features = ["png"], optional = true }
pdf_oxide = { version = "0.3.78", optional = true }
fulgur = { version = "0.40.0", optional = true }
thiserror = "2"
serde = { version = "1.0", features = ["derive"] }

[[bin]]
name = "pdf_agent_cli"
path = "src/main.rs"
required-features = ["reader", "render", "writer"]
